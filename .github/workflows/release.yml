# Publish a release with the tailcat-debug helpers attached, and move the
# major tag (v1) so `uses: Sniperlyf3/PipelineTests@v1` picks it up.
#
# Either push a tag like v1.2.3, or run this workflow by hand (Actions tab, or
# `gh workflow run release.yml -f version=v1.2.3`) and it creates the tag on
# the commit it runs on.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v1.2.3 (tag is created on the selected branch's commit)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::version must look like v1.2.3 (got '$VERSION')"; exit 1; }

      - name: Lint
        run: shellcheck -x bin/tailcat-debug scripts/*.sh

      - name: Build release assets
        run: |
          mkdir -p dist
          sed "s/^TAILCAT_DEBUG_VERSION=\"dev\"$/TAILCAT_DEBUG_VERSION=\"${VERSION}\"/" \
            bin/tailcat-debug > dist/tailcat-debug
          chmod +x dist/tailcat-debug
          grep -q "^TAILCAT_DEBUG_VERSION=\"${VERSION}\"$" dist/tailcat-debug
          sed "s/^\$TailcatDebugVersion = 'dev'$/\$TailcatDebugVersion = '${VERSION}'/" \
            bin/tailcat-debug.ps1 > dist/tailcat-debug.ps1
          grep -q "^\$TailcatDebugVersion = '${VERSION}'$" dist/tailcat-debug.ps1
          (cd dist && sha256sum tailcat-debug tailcat-debug.ps1 > SHA256SUMS)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          # --target creates the tag at this commit if it doesn't exist yet.
          gh release create "$VERSION" dist/tailcat-debug dist/tailcat-debug.ps1 dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "$VERSION" --generate-notes "${prerelease[@]}"

      - name: Move major version tag
        if: ${{ !contains(env.VERSION, '-') }}
        run: |
          major="${VERSION%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
